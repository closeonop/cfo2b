spring:
  application:
    name: emp-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/empdb}
    username: ${DB_USERNAME:emp}
    password: ${DB_PASSWORD:empdevpw}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:platform@local.test}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  # Local simulation only. A fixed code never proves ownership of an email address.
  demo-otp-enabled: ${DEMO_OTP_ENABLED:false}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:}
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000}
  encryption:
    key: ${DATA_ENCRYPTION_KEY:}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    enabled: ${MAIL_ENABLED:true}
  rate-limit:
    login-max-failures: 5
    login-window-minutes: 15
    login-lock-minutes: 15

logging:
  level:
    org.hibernate.SQL: warn
    org.springframework.security: warn

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  bucket: ${STORAGE_BUCKET:emp-files}
  access-key: ${STORAGE_ACCESS_KEY:empminioadmin}
  secret-key: ${STORAGE_SECRET_KEY:empminioadmin-secret}
